[package]
name = "riff-music"
version = "0.6.2"
edition = "2024"
rust-version = "1.85"
description = "A terminal-first music player where playlists are code."
license = "MIT"
repository = "https://github.com/Nicolas25vlad/riff"
homepage = "https://github.com/Nicolas25vlad/riff"
readme = "README.md"
keywords = ["music", "spotify", "terminal", "tui", "rust"]
categories = ["command-line-utilities", "multimedia::audio"]
publish = true
exclude = [".github/**", "packaging/**", "scripts/**", "install.sh", "install.ps1"]

[lib]
name = "riff"
path = "src/lib.rs"

[[bin]]
name = "riff"
path = "src/main.rs"

[dependencies]
crossterm = "0.29"
env_logger = "0.11"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
log = "0.4"
ratatui = "0.30.2"
ratatui-image = { version = "11.0.6", default-features = false, features = ["crossterm"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }

[target.'cfg(target_os = "windows")'.dependencies]
librespot = { version = "0.8.0", default-features = false, features = ["rodio-backend", "rustls-tls-native-roots"] }

[target.'cfg(not(target_os = "windows"))'.dependencies]
librespot = { version = "0.8.0", default-features = false, features = ["rodio-backend", "pulseaudio-backend", "rustls-tls-native-roots"] }

# librespot 0.8.0's build script is incompatible with vergen 9.1.x.
# Keep this exact pin until a crates.io librespot release includes upstream fix #1683.
[build-dependencies]
vergen = "=9.0.6"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
