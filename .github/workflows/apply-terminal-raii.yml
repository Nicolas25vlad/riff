name: Apply terminal RAII hardening

on:
  push:
    branches: [fix/tui-terminal-raii]
    paths:
      - .github/workflows/apply-terminal-raii.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/tui-terminal-raii

      - name: Apply terminal guard
        run: python scripts/apply_terminal_raii.py

      - name: Apply TUI quality invariant
        run: python scripts/apply_terminal_raii_quality.py

      - name: Install Linux audio dependencies
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libpulse-dev pkg-config

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Format
        run: cargo fmt --all

      - name: TUI quality gate
        run: bash scripts/check-tui-quality.sh

      - name: Test
        run: cargo test --all-features --no-fail-fast

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Commit implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/workbench/mod.rs scripts/check-tui-quality.sh
          git commit -m 'fix(tui): make terminal restoration crash-safe'
          git push origin HEAD:fix/tui-terminal-raii
