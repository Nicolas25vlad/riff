name: Sync main into playlist viewport

on:
  push:
    branches: [fix/tui-playlist-viewport]
    paths:
      - .github/workflows/sync-main-playlist-viewport.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/tui-playlist-viewport
          fetch-depth: 0

      - name: Merge latest main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git merge --no-edit origin/main
          git push origin HEAD:fix/tui-playlist-viewport
