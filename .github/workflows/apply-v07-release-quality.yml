name: Apply v0.7 release quality

on:
  push:
    branches: [feat/v0.7-core-polish]
    paths:
      - '.github/workflows/apply-v07-release-quality.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/v0.7-core-polish
      - name: Apply source patch
        run: python scripts/apply_v07_release_quality.py
      - name: Install native dependencies
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libpulse-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --all
      - name: Validate
        run: |
          cargo metadata --locked --format-version 1 > /dev/null
          cargo clippy --locked --all-targets --all-features -- -D warnings
          cargo test --locked --all-targets --all-features
          bash scripts/check-tui-quality.sh
          cargo publish --locked --dry-run --allow-dirty
      - name: Commit source changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add install.sh install.ps1 src/workbench/mod.rs scripts/check-tui-quality.sh
          git commit -m 'build: test TUI rendering and lock installers'
          git push origin HEAD:feat/v0.7-core-polish
