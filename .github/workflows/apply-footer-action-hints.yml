name: Apply footer action hints

on:
  push:
    branches: [feat/tui-footer-action-hints]
    paths:
      - .github/workflows/apply-footer-action-hints.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/tui-footer-action-hints

      - name: Apply footer/action hint integration
        run: python scripts/apply_footer_action_hints.py

      - name: Install Linux audio dependencies
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libpulse-dev pkg-config

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Format
        run: cargo fmt --all

      - name: TUI quality gate
        run: bash scripts/check-tui-quality.sh

      - name: Test
        run: cargo test --locked --all-features --no-fail-fast

      - name: Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Commit implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/workbench/input.rs src/workbench/mod.rs
          git commit -m 'feat(tui): derive footer help from action bindings'
          git push origin HEAD:feat/tui-footer-action-hints
