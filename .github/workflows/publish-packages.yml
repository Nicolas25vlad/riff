name: Publish Packages

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: publish-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  validate-release:
    name: Validate release metadata
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Validate tag matches Cargo.toml
        id: version
        shell: bash
        run: |
          set -euo pipefail
          tag='${{ github.event.release.tag_name }}'
          version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n1)
          test -n "$version"
          if [[ "$tag" != "v$version" ]]; then
            echo "::error::Release tag $tag does not match Cargo.toml version $version (expected v$version)."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Publishing riff-music $version to crates.io"

  crates-io:
    name: Publish crates.io
    needs: validate-release
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Install Linux audio dependencies
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libpulse-dev pkg-config

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache
        uses: Swatinem/rust-cache@v2

      - name: Require crates.io token
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${CARGO_REGISTRY_TOKEN:-}" ]]; then
            echo '::error::Missing repository secret CARGO_REGISTRY_TOKEN.'
            exit 1
          fi

      - name: Verify Cargo.lock
        run: cargo metadata --locked --format-version 1 > /dev/null

      - name: Final crates.io dry run
        run: cargo publish --locked --dry-run

      - name: Publish crates.io
        run: cargo publish --locked
