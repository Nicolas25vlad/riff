name: Harden transition instrumentation

on:
  push:
    branches: [perf/playback-transition-instrumentation]
    paths:
      - .github/workflows/harden-transition-instrumentation.yml

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: perf/playback-transition-instrumentation

      - name: Harden probes
        run: python scripts/harden_transition_instrumentation.py

      - name: Install Linux audio dependencies
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libpulse-dev pkg-config

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Format
        run: cargo fmt --all

      - name: TUI quality gate
        run: bash scripts/check-tui-quality.sh

      - name: Test
        run: cargo test --locked --all-features --no-fail-fast

      - name: Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Commit hardening
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/workbench/player_task.rs
          git commit -m 'perf(playback): harden transition probes'
          git push origin HEAD:perf/playback-transition-instrumentation
