name: Apply provider resolution cache

on:
  push:
    branches: [feat/provider-resolution-cache]
    paths:
      - .github/workflows/apply-resolution-cache.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/provider-resolution-cache

      - name: Patch library and Workbench integration
        shell: python
        run: |
          from pathlib import Path

          lib = Path('src/lib.rs')
          text = lib.read_text()
          needle = 'pub mod player;\n'
          replacement = 'pub mod player;\npub mod resolution_cache;\n'
          assert needle in text, 'lib module anchor not found'
          text = text.replace(needle, replacement, 1)
          lib.write_text(text)

          player = Path('src/player.rs')
          text = player.read_text()
          old_import = '''use crate::{
              fuzzy::{DEFAULT_THRESHOLD, rank_candidates},
              platform,
          };'''
          new_import = '''use crate::{
              fuzzy::{DEFAULT_THRESHOLD, rank_candidates},
              platform,
              resolution_cache::ResolutionCache,
          };'''
          assert old_import in text, 'player import anchor not found'
          text = text.replace(old_import, new_import, 1)

          old_signature = '''async fn resolve_tracks(session: &Session, tracks: &[TrackRequest]) -> Result<Vec<String>, String> {
              let mut resolved = Vec::with_capacity(tracks.len());
          '''
          new_signature = '''pub async fn resolve_requests(tracks: &[TrackRequest]) -> Result<Vec<String>, String> {
              let session = discovery_session().await?;
              let result = resolve_tracks_with_progress(&session, tracks, false).await;
              session.shutdown();
              result
          }

          async fn resolve_tracks(session: &Session, tracks: &[TrackRequest]) -> Result<Vec<String>, String> {
              resolve_tracks_with_progress(session, tracks, true).await
          }

          async fn resolve_tracks_with_progress(
              session: &Session,
              tracks: &[TrackRequest],
              verbose: bool,
          ) -> Result<Vec<String>, String> {
              let mut resolved = Vec::with_capacity(tracks.len());
              let mut resolution_cache = ResolutionCache::load();
          '''
          assert old_signature in text, 'resolve_tracks signature anchor not found'
          text = text.replace(old_signature, new_signature, 1)

          old_pinned = '''            println!("  [{}/{}] pinned {}", index + 1, tracks.len(), track.label);
                      println!("       -> {uri}");
                      resolved.push(uri.to_string());
                      continue;
                  }

                  println!(
                      "  [{}/{}] resolving {}",
                      index + 1,
                      tracks.len(),
                      track.label
                  );
          '''
          new_pinned = '''            if verbose {
                          println!("  [{}/{}] pinned {}", index + 1, tracks.len(), track.label);
                          println!("       -> {uri}");
                      }
                      resolved.push(uri.to_string());
                      continue;
                  }

                  if let Some(uri) = resolution_cache
                      .as_ref()
                      .and_then(|cache| cache.get("spotify", &track.label))
                      .filter(|uri| is_spotify_track_uri(uri))
                  {
                      if verbose {
                          println!("  [{}/{}] cached {}", index + 1, tracks.len(), track.label);
                          println!("       -> {uri}");
                      }
                      log::debug!("resolution cache hit for `{}` -> {uri}", track.label);
                      resolved.push(uri.to_string());
                      continue;
                  }

                  log::debug!("resolution cache miss for `{}`", track.label);
                  if verbose {
                      println!(
                          "  [{}/{}] resolving {}",
                          index + 1,
                          tracks.len(),
                          track.label
                      );
                  }
          '''
          assert old_pinned in text, 'pinned/resolving anchor not found'
          text = text.replace(old_pinned, new_pinned, 1)

          old_candidate = '''        println!(
                      "       -> {} ({}, {confidence}% match)",
                      candidate.display_name(),
                      candidate.uri
                  );
                  resolved.push(candidate.uri);
          '''
          new_candidate = '''        if verbose {
                      println!(
                          "       -> {} ({}, {confidence}% match)",
                          candidate.display_name(),
                          candidate.uri
                      );
                  }
                  if let Some(cache) = resolution_cache.as_mut() {
                      cache.insert("spotify", &track.label, &candidate.uri);
                      if let Err(error) = cache.save() {
                          log::debug!("could not persist resolution cache: {error}");
                      }
                  }
                  resolved.push(candidate.uri);
          '''
          assert old_candidate in text, 'candidate result anchor not found'
          text = text.replace(old_candidate, new_candidate, 1)
          player.write_text(text)

          workbench = Path('src/workbench/player_task.rs')
          text = workbench.read_text()
          old_queue = '''pub async fn resolve_queue(playlist: &Playlist) -> Result<Vec<QueueItem>, String> {
              let (session_config, cache, credentials) = session_parts()?;
              let session = Session::new(session_config, Some(cache));
              session
                  .connect(credentials, false)
                  .await
                  .map_err(|err| format!("could not connect to Spotify for TUI metadata: {err}"))?;

              let mut queue = Vec::with_capacity(playlist.tracks.len());
              for request in &playlist.tracks {
                  let uri = if let Some(uri) = request.id.as_deref() {
                      uri.to_string()
                  } else {
                      player::search(&request.label, 1)
                          .await?
                          .into_iter()
                          .next()
                          .ok_or_else(|| format!("no confident Spotify track found for `{}`", request.label))?
                          .uri
                  };

                  queue.push(queue_item_from_uri(&session, &uri).await?);
              }

              session.shutdown();
              Ok(queue)
          }
          '''
          new_queue = '''pub async fn resolve_queue(playlist: &Playlist) -> Result<Vec<QueueItem>, String> {
              let requests = playlist
                  .tracks
                  .iter()
                  .map(|track| player::TrackRequest {
                      label: track.label.clone(),
                      id: track.id.clone(),
                  })
                  .collect::<Vec<_>>();
              let resolved = player::resolve_requests(&requests).await?;

              let (session_config, cache, credentials) = session_parts()?;
              let session = Session::new(session_config, Some(cache));
              session
                  .connect(credentials, false)
                  .await
                  .map_err(|err| format!("could not connect to Spotify for TUI metadata: {err}"))?;

              let mut queue = Vec::with_capacity(resolved.len());
              for uri in resolved {
                  queue.push(queue_item_from_uri(&session, &uri).await?);
              }

              session.shutdown();
              Ok(queue)
          }
          '''
          assert old_queue in text, 'resolve_queue anchor not found'
          text = text.replace(old_queue, new_queue, 1)
          workbench.write_text(text)

      - name: Install Linux audio dependencies
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libpulse-dev pkg-config

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Format
        run: cargo fmt --all

      - name: Test
        run: cargo test --all-features --no-fail-fast

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Remove staging workflow
        run: rm .github/workflows/apply-resolution-cache.yml

      - name: Commit implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/lib.rs src/player.rs src/workbench/player_task.rs src/resolution_cache.rs .github/workflows/apply-resolution-cache.yml
          git commit -m 'feat(provider): cache track resolution across playlist loads'
          git push origin HEAD:feat/provider-resolution-cache
