name: Fix PR33 Review Gate

on:
  push:
    branches: [feat/workbench-v2-shell]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/workbench-v2-shell
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Preserve Search playback metadata outside playlist queue
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          model = Path('src/workbench/model.rs')
          text = model.read_text()
          needle = '''    pub queue: Vec<QueueItem>,\n    pub status: PlaybackStatus,'''
          replacement = '''    pub queue: Vec<QueueItem>,\n    pub transient_current: Option<QueueItem>,\n    pub status: PlaybackStatus,'''
          if needle not in text:
              raise SystemExit('AppState queue anchor not found')
          text = text.replace(needle, replacement, 1)

          needle = '''    pub fn current(&self) -> Option<&QueueItem> {\n        self.current_index().and_then(|index| self.queue.get(index))\n    }'''
          replacement = '''    pub fn current(&self) -> Option<&QueueItem> {\n        let uri = self.current_uri.as_deref()?;\n        self.queue\n            .iter()\n            .find(|item| item.uri == uri)\n            .or_else(|| {\n                self.transient_current\n                    .as_ref()\n                    .filter(|item| item.uri == uri)\n            })\n    }'''
          if needle not in text:
              raise SystemExit('AppState current anchor not found')
          model.write_text(text.replace(needle, replacement, 1))

          ui = Path('src/workbench/mod.rs')
          text = ui.read_text()
          needle = '''        queue: queue.clone(),\n        status: PlaybackStatus::Starting,'''
          replacement = '''        queue: queue.clone(),\n        transient_current: None,\n        status: PlaybackStatus::Starting,'''
          if needle not in text:
              raise SystemExit('Workbench state init anchor not found')
          text = text.replace(needle, replacement, 1)

          needle = '''fn play_selected_search(workbench: &mut Workbench, controls: &mpsc::UnboundedSender<Control>) {\n    if let Some(item) = workbench.state.search.selected() {\n        let _ = controls.send(Control::PlayUri(item.uri.clone()));\n        workbench.state.message = format!("playing search result · {}", item.label());\n    }\n}'''
          replacement = '''fn play_selected_search(workbench: &mut Workbench, controls: &mpsc::UnboundedSender<Control>) {\n    if let Some(item) = workbench.state.search.selected().cloned() {\n        workbench.state.transient_current = Some(item.clone());\n        request_item_artwork(workbench, &item, controls);\n        let _ = controls.send(Control::PlayUri(item.uri.clone()));\n        workbench.state.message = format!("playing search result · {}", item.label());\n    }\n}'''
          if needle not in text:
              raise SystemExit('play_selected_search anchor not found')
          text = text.replace(needle, replacement, 1)

          needle = '''            workbench.state.current_uri = Some(uri.clone());\n            workbench.state.position_ms = position_ms;\n            if changed {'''
          replacement = '''            workbench.state.current_uri = Some(uri.clone());\n            workbench.state.position_ms = position_ms;\n            if workbench.state.queue.iter().any(|item| item.uri == uri) {\n                workbench.state.transient_current = None;\n            }\n            if changed {'''
          if needle not in text:
              raise SystemExit('PlayerUpdate Track anchor not found')
          ui.write_text(text.replace(needle, replacement, 1))
          PY

      - name: Install native dependencies
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libpulse-dev pkg-config

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Validate fix
        run: |
          cargo fmt --all
          cargo clippy --all-targets --all-features -- -D warnings
          cargo test --all-features --no-fail-fast

      - name: Commit fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/workbench/mod.rs src/workbench/model.rs
          git commit -m "fix(tui): keep Search playback metadata in Now Playing"
          git push origin HEAD:feat/workbench-v2-shell
