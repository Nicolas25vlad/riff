name: Apply TUI Mouse Polish

on:
  push:
    branches: [fix/tui-hardening-polish]
    paths:
      - '.github/workflows/apply-tui-mouse-polish.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/tui-hardening-polish
          fetch-depth: 0

      - name: Make wheel actions contextual
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('src/workbench/mod.rs')
          text = path.read_text()
          pattern = re.compile(r'''        MouseEventKind::ScrollUp => \{\n            if workbench\.state\.view == View::Search \{\n                workbench\.state\.search\.move_up\(\);\n                request_selected_search_artwork\(workbench, controls\);\n            \} else \{\n                let _ = controls\.send\(Control::VolumeUp\);\n            \}\n        \}\n        MouseEventKind::ScrollDown => \{\n            if workbench\.state\.view == View::Search \{\n                workbench\.state\.search\.move_down\(\);\n                request_selected_search_artwork\(workbench, controls\);\n            \} else \{\n                let _ = controls\.send\(Control::VolumeDown\);\n            \}\n        \}''')
          replacement = '''        MouseEventKind::ScrollUp => {
              if workbench.state.view == View::Search {
                  workbench.state.search.move_up();
                  request_selected_search_artwork(workbench, controls);
              } else if workbench
                  .state
                  .hits
                  .volume
                  .is_some_and(|rect| contains(rect, point))
              {
                  let _ = controls.send(Control::VolumeUp);
              }
          }
          MouseEventKind::ScrollDown => {
              if workbench.state.view == View::Search {
                  workbench.state.search.move_down();
                  request_selected_search_artwork(workbench, controls);
              } else if workbench
                  .state
                  .hits
                  .volume
                  .is_some_and(|rect| contains(rect, point))
              {
                  let _ = controls.send(Control::VolumeDown);
              }
          }'''
          updated, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'expected one mouse scroll block, replaced {count}')
          path.write_text(updated)

      - name: Format
        run: cargo fmt --all

      - name: Remove one-shot workflow
        run: rm .github/workflows/apply-tui-mouse-polish.yml

      - name: Commit
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'fix(tui): make mouse wheel controls contextual'
          git push origin HEAD:fix/tui-hardening-polish
