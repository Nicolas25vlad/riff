name: Harden canonical ranking

on:
  push:
    branches: [fix/search-canonical-releases]
    paths:
      - .github/workflows/harden-canonical-ranking.yml

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/search-canonical-releases

      - name: Restrict release-year tie-break
        run: python scripts/harden_canonical_release_tiebreak.py

      - name: Install Linux audio dependencies
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libpulse-dev pkg-config

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Format
        run: cargo fmt --all

      - name: Test
        run: cargo test --locked --all-features --no-fail-fast

      - name: Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Commit hardening
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/fuzzy.rs
          git commit -m 'fix(search): scope canonical tie-break to same recording'
          git push origin HEAD:fix/search-canonical-releases
