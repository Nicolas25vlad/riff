name: Apply v0.7 core polish

on:
  push:
    branches: [feat/v0.7-core-polish]
    paths:
      - '.github/workflows/apply-v07-core.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/v0.7-core-polish
      - name: Apply source changes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              s = p.read_text()
              if old not in s:
                  raise SystemExit(f'missing pattern in {path}: {old[:100]!r}')
              p.write_text(s.replace(old, new, 1))

          # lib.rs: expose persistent resolution cache.
          replace('src/lib.rs', 'pub mod player;\n', 'pub mod player;\npub mod resolution_cache;\n')

          # platform.rs: central cache root shared by Spotify and resolution cache.
          old = '''pub fn spotify_cache_dir() -> Result<PathBuf, String> {
              if let Some(path) = env::var_os("XDG_CACHE_HOME") {
                  return Ok(PathBuf::from(path).join("riff").join("spotify"));
              }

              if cfg!(target_os = "windows") {
                  if let Some(path) = env::var_os("LOCALAPPDATA") {
                      return Ok(PathBuf::from(path).join("Riff").join("spotify"));
                  }
                  if let Some(path) = env::var_os("USERPROFILE") {
                      return Ok(PathBuf::from(path)
                          .join(".cache")
                          .join("riff")
                          .join("spotify"));
                  }
              }

              if let Some(path) = env::var_os("HOME") {
                  return Ok(PathBuf::from(path)
                      .join(".cache")
                      .join("riff")
                      .join("spotify"));
              }

              Err(
                  "could not determine a cache directory; set XDG_CACHE_HOME or a platform home directory"
                      .to_string(),
              )
          }
          '''
          new = '''pub fn riff_cache_dir() -> Result<PathBuf, String> {
              if let Some(path) = env::var_os("XDG_CACHE_HOME") {
                  return Ok(PathBuf::from(path).join("riff"));
              }

              if cfg!(target_os = "windows") {
                  if let Some(path) = env::var_os("LOCALAPPDATA") {
                      return Ok(PathBuf::from(path).join("Riff"));
                  }
                  if let Some(path) = env::var_os("USERPROFILE") {
                      return Ok(PathBuf::from(path).join(".cache").join("riff"));
                  }
              }

              if let Some(path) = env::var_os("HOME") {
                  return Ok(PathBuf::from(path).join(".cache").join("riff"));
              }

              Err(
                  "could not determine a cache directory; set XDG_CACHE_HOME or a platform home directory"
                      .to_string(),
              )
          }

          pub fn spotify_cache_dir() -> Result<PathBuf, String> {
              Ok(riff_cache_dir()?.join("spotify"))
          }
          '''
          replace('src/platform.rs', old, new)

          # player.rs: wider discovery + persistent resolve cache.
          replace('src/player.rs', '    platform,\n};', '    platform,\n    resolution_cache::ResolutionCache,\n};')
          replace('src/player.rs', 'const FUZZY_CANDIDATE_POOL: usize = 30;', 'const FUZZY_CANDIDATE_POOL: usize = 80;')
          replace('src/player.rs', '''async fn resolve_tracks(session: &Session, tracks: &[TrackRequest]) -> Result<Vec<String>, String> {
              let mut resolved = Vec::with_capacity(tracks.len());
          ''', '''async fn resolve_tracks(session: &Session, tracks: &[TrackRequest]) -> Result<Vec<String>, String> {
              let mut resolved = Vec::with_capacity(tracks.len());
              let resolution_cache = ResolutionCache::open()?;
          ''')
          replace('src/player.rs', '''        println!(
                      "  [{}/{}] resolving {}",
                      index + 1,
                      tracks.len(),
                      track.label
                  );
                  let candidates =
                      smart_search_with_session(session, &track.label, 1, false, DEFAULT_THRESHOLD).await?;
          ''', '''        if let Some(uri) = resolution_cache.get(&track.label) {
                      println!(
                          "  [{}/{}] cached {}",
                          index + 1,
                          tracks.len(),
                          track.label
                      );
                      println!("       -> {uri}");
                      resolved.push(uri);
                      continue;
                  }

                  println!(
                      "  [{}/{}] resolving {}",
                      index + 1,
                      tracks.len(),
                      track.label
                  );
                  let candidates =
                      smart_search_with_session(session, &track.label, 1, false, DEFAULT_THRESHOLD).await?;
          ''')
          replace('src/player.rs', '''        resolved.push(candidate.uri);
              }
          ''', '''        resolution_cache.put(&track.label, &candidate.uri)?;
                  resolved.push(candidate.uri);
              }
          ''')

          # player_task.rs: reuse persistent cache and debounce volume writes.
          replace('src/workbench/player_task.rs', 'use riff::{Playlist, platform, player};', 'use riff::{Playlist, platform, player, resolution_cache::ResolutionCache};')
          replace('src/workbench/player_task.rs', '    VolumeUp,\n    VolumeDown,\n', '')
          replace('src/workbench/player_task.rs', '''    let mut queue = Vec::with_capacity(playlist.tracks.len());
              for request in &playlist.tracks {
                  let uri = if let Some(uri) = request.id.as_deref() {
                      uri.to_string()
                  } else {
                      player::search(&request.label, 1)
                          .await?
                          .into_iter()
                          .next()
                          .ok_or_else(|| format!("no confident Spotify track found for `{}`", request.label))?
                          .uri
                  };

                  queue.push(queue_item_from_uri(&session, &uri).await?);
              }
          ''', '''    let mut queue = Vec::with_capacity(playlist.tracks.len());
              let resolution_cache = ResolutionCache::open()?;
              for request in &playlist.tracks {
                  let uri = if let Some(uri) = request.id.as_deref() {
                      uri.to_string()
                  } else if let Some(uri) = resolution_cache.get(&request.label) {
                      uri
                  } else {
                      let uri = player::search(&request.label, 1)
                          .await?
                          .into_iter()
                          .next()
                          .ok_or_else(|| format!("no confident Spotify track found for `{}`", request.label))?
                          .uri;
                      resolution_cache.put(&request.label, &uri)?;
                      uri
                  };

                  queue.push(queue_item_from_uri(&session, &uri).await?);
              }
          ''')
          replace('src/workbench/player_task.rs', '''    let lyrics_pending = Arc::new(Mutex::new(HashSet::<String>::new()));

              tokio::pin!(spirc_task);
          ''', '''    let lyrics_pending = Arc::new(Mutex::new(HashSet::<String>::new()));
              let mut volume_tick = tokio::time::interval(Duration::from_millis(40));
              volume_tick.set_missed_tick_behavior(tokio::time::MissedTickBehavior::Skip);
              let mut pending_volume: Option<u16> = None;

              tokio::pin!(spirc_task);
          ''')
          replace('src/workbench/player_task.rs', '''        tokio::select! {
                      _ = &mut spirc_task => return Err("Spotify Connect stopped unexpectedly".to_string()),
                      command = controls.recv() => {
          ''', '''        tokio::select! {
                      _ = &mut spirc_task => return Err("Spotify Connect stopped unexpectedly".to_string()),
                      _ = volume_tick.tick(), if pending_volume.is_some() => {
                          let volume = pending_volume.take().expect("guarded by is_some");
                          spirc.set_volume(volume).map_err(|err| format!("could not set volume: {err}"))?;
                      }
                      command = controls.recv() => {
          ''')
          replace('src/workbench/player_task.rs', '''                    Some(Control::VolumeUp) => spirc.volume_up().map_err(|err| format!("could not raise volume: {err}"))?,
                              Some(Control::VolumeDown) => spirc.volume_down().map_err(|err| format!("could not lower volume: {err}"))?,
                              Some(Control::SetVolume(volume)) => spirc.set_volume(volume).map_err(|err| format!("could not set volume: {err}"))?,
          ''', '''                    Some(Control::SetVolume(volume)) => pending_volume = Some(volume),
          ''')

          # Workbench: 5-point volume, immediate UI feedback, RAII terminal ownership.
          replace('src/workbench/mod.rs', 'const VOLUME_MAX: u16 = u16::MAX;\nconst SEEK_STEP_MS: u32 = 5_000;', 'const VOLUME_MAX: u16 = u16::MAX;\nconst VOLUME_STEP_PERCENT: u8 = 5;\nconst SEEK_STEP_MS: u32 = 5_000;')
          replace('src/workbench/mod.rs', '''async fn run_terminal(
          ''', '''struct TerminalModeGuard {
              raw_enabled: bool,
              alternate_enabled: bool,
          }

          impl Drop for TerminalModeGuard {
              fn drop(&mut self) {
                  if self.alternate_enabled {
                      let mut stdout = io::stdout();
                      let _ = execute!(stdout, DisableMouseCapture, LeaveAlternateScreen);
                  }
                  if self.raw_enabled {
                      let _ = disable_raw_mode();
                  }
              }
          }

          async fn run_terminal(
          ''')
          replace('src/workbench/mod.rs', '''    enable_raw_mode().map_err(|error| format!("could not enable terminal raw mode: {error}"))?;
              let mut stdout = io::stdout();
              execute!(stdout, EnterAlternateScreen, EnableMouseCapture)
                  .map_err(|error| format!("could not enter alternate screen: {error}"))?;

              let picker = Picker::from_query_stdio().unwrap_or_else(|_| Picker::halfblocks());
          ''', '''    enable_raw_mode().map_err(|error| format!("could not enable terminal raw mode: {error}"))?;
              let mut terminal_mode = TerminalModeGuard {
                  raw_enabled: true,
                  alternate_enabled: false,
              };
              let mut stdout = io::stdout();
              execute!(stdout, EnterAlternateScreen, EnableMouseCapture)
                  .map_err(|error| format!("could not enter alternate screen: {error}"))?;
              terminal_mode.alternate_enabled = true;

              let picker = Picker::from_query_stdio().unwrap_or_else(|_| Picker::halfblocks());
          ''')
          replace('src/workbench/mod.rs', '''    let restore = restore_terminal(&mut terminal);
              loop_result.and(restore)
          }
          ''', '''    let cursor_result = terminal
                  .show_cursor()
                  .map_err(|error| format!("could not restore cursor: {error}"));
              drop(terminal_mode);
              loop_result.and(cursor_result)
          }
          ''')
          replace('src/workbench/mod.rs', '''        KeyCode::Char('+') | KeyCode::Char('=') => {
                      let _ = controls.send(Control::VolumeUp);
                  }
                  KeyCode::Char('-') => {
                      let _ = controls.send(Control::VolumeDown);
                  }
          ''', '''        KeyCode::Char('+') | KeyCode::Char('=') => adjust_volume(workbench, VOLUME_STEP_PERCENT as i16, controls),
                  KeyCode::Char('-') => adjust_volume(workbench, -(VOLUME_STEP_PERCENT as i16), controls),
          ''')
          replace('src/workbench/mod.rs', '''fn seek_relative(workbench: &Workbench, delta_ms: i64, controls: &mpsc::UnboundedSender<Control>) {
          ''', '''fn volume_percent(volume: u16) -> u8 {
              ((u32::from(volume) * 100 + u32::from(VOLUME_MAX) / 2) / u32::from(VOLUME_MAX)) as u8
          }

          fn volume_from_percent(percent: u8) -> u16 {
              ((u32::from(percent.min(100)) * u32::from(VOLUME_MAX) + 50) / 100) as u16
          }

          fn quantize_volume_percent(percent: u8) -> u8 {
              (((percent.min(100) + VOLUME_STEP_PERCENT / 2) / VOLUME_STEP_PERCENT) * VOLUME_STEP_PERCENT)
                  .min(100)
          }

          fn set_volume_percent(
              workbench: &mut Workbench,
              percent: u8,
              controls: &mpsc::UnboundedSender<Control>,
          ) {
              let percent = quantize_volume_percent(percent);
              let volume = volume_from_percent(percent);
              workbench.state.volume = volume;
              let _ = controls.send(Control::SetVolume(volume));
          }

          fn adjust_volume(
              workbench: &mut Workbench,
              delta: i16,
              controls: &mpsc::UnboundedSender<Control>,
          ) {
              let current = i16::from(volume_percent(workbench.state.volume));
              let target = (current + delta).clamp(0, 100) as u8;
              set_volume_percent(workbench, target, controls);
          }

          fn seek_relative(workbench: &Workbench, delta_ms: i64, controls: &mpsc::UnboundedSender<Control>) {
          ''')
          replace('src/workbench/mod.rs', '''                    let _ = controls.send(Control::SetVolume(
                                  (VOLUME_MAX as f64 * relative.clamp(0.0, 1.0)) as u16,
                              ));
          ''', '''                    let percent = (relative.clamp(0.0, 1.0) * 100.0).round() as u8;
                              set_volume_percent(workbench, percent, controls);
          ''')
          replace('src/workbench/mod.rs', '''                let _ = controls.send(Control::VolumeUp);
          ''', '''                adjust_volume(workbench, VOLUME_STEP_PERCENT as i16, controls);
          ''')
          replace('src/workbench/mod.rs', '''                let _ = controls.send(Control::VolumeDown);
          ''', '''                adjust_volume(workbench, -(VOLUME_STEP_PERCENT as i16), controls);
          ''')
          replace('src/workbench/mod.rs', '''    let volume_ratio = workbench.state.volume as f64 / VOLUME_MAX as f64;
              frame.render_widget(
                  Gauge::default()
                      .ratio(volume_ratio)
                      .label(format!("vol {:>3}%", (volume_ratio * 100.0).round() as u8)),
          ''', '''    let volume_percent = volume_percent(workbench.state.volume);
              let volume_ratio = f64::from(volume_percent) / 100.0;
              frame.render_widget(
                  Gauge::default()
                      .ratio(volume_ratio)
                      .label(format!("vol {volume_percent:>3}%")),
          ''')
          # remove old explicit restore helper; Drop guard owns lifecycle.
          start = Path('src/workbench/mod.rs').read_text()
          old_restore = '''fn restore_terminal(terminal: &mut Terminal<CrosstermBackend<io::Stdout>>) -> Result<(), String> {
              disable_raw_mode().map_err(|error| format!("could not restore terminal mode: {error}"))?;
              execute!(
                  terminal.backend_mut(),
                  DisableMouseCapture,
                  LeaveAlternateScreen
              )
              .map_err(|error| format!("could not leave alternate screen: {error}"))?;
              terminal
                  .show_cursor()
                  .map_err(|error| format!("could not restore cursor: {error}"))
          }
          '''
          if old_restore not in start:
              raise SystemExit('missing restore_terminal helper')
          Path('src/workbench/mod.rs').write_text(start.replace(old_restore, '', 1))
          replace('src/workbench/mod.rs', '''    fn rectangle_hit_test_is_half_open() {
          ''', '''    fn volume_math_is_quantized_and_bounded() {
                  assert_eq!(volume_percent(volume_from_percent(0)), 0);
                  assert_eq!(volume_percent(volume_from_percent(5)), 5);
                  assert_eq!(volume_percent(volume_from_percent(95)), 95);
                  assert_eq!(volume_percent(volume_from_percent(100)), 100);
                  assert_eq!(quantize_volume_percent(2), 0);
                  assert_eq!(quantize_volume_percent(3), 5);
                  assert_eq!(quantize_volume_percent(98), 100);
              }

              #[test]
              fn rectangle_hit_test_is_half_open() {
          ''')

          # Broader search ranking regression: compilation gets a penalty, studio/canonical stays preferred.
          replace('src/fuzzy.rs', '''        "re-record",
              ]
          ''', '''        "re-record",
                  "greatest hits",
                  "best of",
                  "compilation",
              ]
          ''')
          replace('src/fuzzy.rs', '''    fn normalizes_punctuation_and_case() {
          ''', '''    fn prefers_canonical_album_over_compilation_when_match_is_equal() {
                  let mut canonical = candidate("War Pigs", "Black Sabbath");
                  canonical.metadata.insert("album".into(), "Paranoid".into());
                  let mut compilation = candidate("War Pigs", "Black Sabbath");
                  compilation.metadata.insert("album".into(), "Black Sabbath Greatest Hits".into());
                  compilation.metadata.insert("popularity".into(), "99".into());
                  let ranked = rank_candidates(
                      "Black Sabbath War Pigs",
                      vec![compilation, canonical],
                      false,
                      DEFAULT_THRESHOLD,
                  );
                  assert_eq!(ranked[0].metadata["album"], "Paranoid");
              }

              #[test]
              fn normalizes_punctuation_and_case() {
          ''')
          PY
      - name: Install native dependencies
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libpulse-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --all
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test --all-targets --all-features
      - name: Check
        run: cargo check --all-targets --all-features
      - name: Commit patch and remove bootstrap workflow
        shell: bash
        run: |
          rm .github/workflows/apply-v07-core.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: implement v0.7 core polish' || exit 0
          git push origin HEAD:feat/v0.7-core-polish
