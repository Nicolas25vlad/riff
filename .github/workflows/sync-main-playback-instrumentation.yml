name: Sync main into playback instrumentation

on:
  push:
    branches: [perf/playback-transition-instrumentation]
    paths:
      - .github/workflows/sync-main-playback-instrumentation.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: perf/playback-transition-instrumentation
          fetch-depth: 0

      - name: Merge latest main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git merge --no-edit origin/main
          git push origin HEAD:perf/playback-transition-instrumentation
