name: Fix Workbench Clippy

on:
  push:
    branches: [feat/workbench-v2-shell]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/workbench-v2-shell
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply deterministic cleanup
        shell: bash
        run: |
          sed -i 's/path::{Path, PathBuf}/path::PathBuf/' src/workbench/mod.rs
          sed -i 's/use riff::{Playlist, Track};/use riff::Playlist;/' src/workbench/mod.rs
          perl -0pi -e 's/\npub fn create_playlist\(.*?\n\}\n\n(?=\#\[cfg\(test\)\])//s' src/workbench/mod.rs
          perl -0pi -e 's/(use super::model::\{LyricsLine, PlaybackStatus, QueueItem\};\n)/$1\ntype LyricsCache = Arc<Mutex<HashMap<String, (String, Vec<LyricsLine>)>>>;\n/' src/workbench/player_task.rs
          sed -i 's/cache: Arc<Mutex<HashMap<String, (String, Vec<LyricsLine>)>>>,/cache: LyricsCache,/' src/workbench/player_task.rs

      - name: Install native audio dependencies
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libpulse-dev pkg-config

      - name: Install Rust tooling
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Apply Clippy suggestions
        run: cargo clippy --fix --allow-dirty --allow-staged --all-targets --all-features -- -D warnings

      - name: Format
        run: cargo fmt --all

      - name: Commit fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/workbench/mod.rs src/workbench/player_task.rs
          git commit -m "refactor: satisfy Workbench clippy"
          git push origin HEAD:feat/workbench-v2-shell
