name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Linux quality
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate shell helpers
        run: bash -n install.sh scripts/deps.sh scripts/check-tui-quality.sh scripts/check-release-workflow.sh

      - name: Validate release workflow contract
        run: bash scripts/check-release-workflow.sh

      - name: Install Linux audio dependencies
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libpulse-dev pkg-config

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache
        uses: Swatinem/rust-cache@v2

      - name: Check dependency helper
        run: bash scripts/deps.sh check

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --all-features --no-fail-fast

      - name: Check
        run: cargo check --all-targets --all-features

      - name: CLI smoke test
        shell: bash
        run: |
          cargo build --all-features
          ./target/debug/riff --version
          ./target/debug/riff validate examples/coding-metal.riff
          ./target/debug/riff inspect examples/coding-metal.riff

      - name: Write job summary
        if: always()
        shell: bash
        run: |
          {
            echo '## Linux quality'
            echo
            echo '- Commit: `${{ github.sha }}`'
            echo '- Rust: `stable`'
            echo '- Checks: release contract, fmt, clippy, tests, cargo check, CLI smoke test'
          } >> "$GITHUB_STEP_SUMMARY"

  tui-quality:
    name: TUI quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux audio dependencies
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libpulse-dev pkg-config

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache
        uses: Swatinem/rust-cache@v2

      - name: Enforce terminal ownership and Workbench tests
        run: bash scripts/check-tui-quality.sh

      - name: Write TUI quality summary
        if: always()
        shell: bash
        run: |
          {
            echo '## TUI quality gate'
            echo
            echo '- No direct stdout/stderr writes from `src/workbench`'
            echo '- No CLI/env_logger initialization from Workbench code'
            echo '- Workbench-specific input/hitbox tests executed'
          } >> "$GITHUB_STEP_SUMMARY"

  windows:
    name: Windows 11 compatible build
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache
        uses: Swatinem/rust-cache@v2

      - name: Validate PowerShell installer
        shell: pwsh
        run: $null = [scriptblock]::Create((Get-Content -Raw ./install.ps1))

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --all-features --no-fail-fast

      - name: Check
        run: cargo check --all-targets --all-features

      - name: CLI smoke test
        shell: pwsh
        run: |
          cargo build --all-features
          .\target\debug\riff.exe --version
          .\target\debug\riff.exe validate examples\coding-metal.riff
          .\target\debug\riff.exe inspect examples\coding-metal.riff

      - name: Write job summary
        if: always()
        shell: pwsh
        run: |
          @"
          ## Windows quality

          - Commit: `${{ github.sha }}`
          - Rust: `stable`
          - Checks: fmt, clippy, tests, cargo check, CLI smoke test
          "@ | Add-Content -Path $env:GITHUB_STEP_SUMMARY

  deploy-main:
    name: Publish main snapshot
    needs: [quality, tui-quality, windows]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux audio dependencies
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libpulse-dev pkg-config

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache
        uses: Swatinem/rust-cache@v2

      - name: Build production binary
        run: cargo build --release --locked

      - name: Package deployment
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp target/release/riff dist/riff
          tar -C dist -czf riff-linux-x86_64.tar.gz riff
          sha256sum riff-linux-x86_64.tar.gz > riff-linux-x86_64.tar.gz.sha256

      - name: Deploy public main snapshot to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="main-snapshot"
          notes="Continuous Linux build from main, commit ${GITHUB_SHA}. This is a development snapshot, not a stable release."
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" riff-linux-x86_64.tar.gz riff-linux-x86_64.tar.gz.sha256 --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit "$tag" --notes "$notes" --repo "$GITHUB_REPOSITORY"
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/git/refs/tags/${tag}" -f sha="$GITHUB_SHA" -F force=true >/dev/null
          else
            gh release create "$tag" riff-linux-x86_64.tar.gz riff-linux-x86_64.tar.gz.sha256 \
              --target "$GITHUB_SHA" \
              --title "Riff main snapshot" \
              --notes "$notes" \
              --prerelease \
              --latest=false \
              --repo "$GITHUB_REPOSITORY"
          fi
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json url,tagName,assets

      - name: Deployment summary
        run: |
          echo '## CD: main snapshot' >> "$GITHUB_STEP_SUMMARY"
          echo '- CI Linux, TUI and Windows gates passed.' >> "$GITHUB_STEP_SUMMARY"
          echo '- Snapshot: https://github.com/${GITHUB_REPOSITORY}/releases/tag/main-snapshot' >> "$GITHUB_STEP_SUMMARY"
          echo '- Commit: ${GITHUB_SHA}' >> "$GITHUB_STEP_SUMMARY"
