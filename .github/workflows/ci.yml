name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Linux quality
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate shell helpers
        run: bash -n install.sh scripts/deps.sh

      - name: Install Linux audio dependencies
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libpulse-dev pkg-config

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache
        uses: Swatinem/rust-cache@v2

      - name: Check dependency helper
        run: bash scripts/deps.sh check

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --all-features --no-fail-fast

      - name: Check
        run: cargo check --all-targets --all-features

      - name: CLI smoke test
        shell: bash
        run: |
          cargo build --all-features
          ./target/debug/riff --version
          ./target/debug/riff validate examples/coding-metal.riff
          ./target/debug/riff inspect examples/coding-metal.riff

      - name: Write job summary
        if: always()
        shell: bash
        run: |
          {
            echo '## Linux quality'
            echo
            echo '- Commit: `${{ github.sha }}`'
            echo '- Rust: `stable`'
            echo '- Checks: fmt, clippy, tests, cargo check, CLI smoke test'
          } >> "$GITHUB_STEP_SUMMARY"

  windows:
    name: Windows 11 compatible build
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache
        uses: Swatinem/rust-cache@v2

      - name: Validate PowerShell installer
        shell: pwsh
        run: $null = [scriptblock]::Create((Get-Content -Raw ./install.ps1))

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --all-features --no-fail-fast

      - name: Check
        run: cargo check --all-targets --all-features

      - name: CLI smoke test
        shell: pwsh
        run: |
          cargo build --all-features
          .\target\debug\riff.exe --version
          .\target\debug\riff.exe validate examples\coding-metal.riff
          .\target\debug\riff.exe inspect examples\coding-metal.riff

      - name: Write job summary
        if: always()
        shell: pwsh
        run: |
          @"
          ## Windows quality

          - Commit: `${{ github.sha }}`
          - Rust: `stable`
          - Checks: fmt, clippy, tests, cargo check, CLI smoke test
          "@ | Add-Content -Path $env:GITHUB_STEP_SUMMARY
