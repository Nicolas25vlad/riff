name: Harden provider resolution cache

on:
  push:
    branches: [feat/provider-resolution-cache]
    paths:
      - .github/workflows/harden-resolution-cache.yml

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/provider-resolution-cache

      - name: Apply stale-cache fallback
        run: python scripts/harden_resolution_cache.py

      - name: Install Linux audio dependencies
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libpulse-dev pkg-config

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Format
        run: cargo fmt --all

      - name: Test
        run: cargo test --all-features --no-fail-fast

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Commit hardening
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/player.rs
          git commit -m 'fix(provider): fall back when cached track is stale'
          git push origin HEAD:feat/provider-resolution-cache
