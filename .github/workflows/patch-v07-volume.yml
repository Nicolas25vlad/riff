name: Patch v0.7 volume stability

on:
  push:
    branches:
      - fix/v07-volume-stability
    paths:
      - scripts/patch_v07_volume.py
      - .github/workflows/patch-v07-volume.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/v07-volume-stability
      - name: Apply patch
        run: python3 scripts/patch_v07_volume.py
      - name: Format and cleanup
        run: |
          cargo fmt --all
          rm scripts/patch_v07_volume.py
          rm .github/workflows/patch-v07-volume.yml
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(playback): stabilize five-step volume control"
          git push origin HEAD:fix/v07-volume-stability
