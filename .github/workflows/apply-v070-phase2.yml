name: Apply v0.7 cache and search

on:
  push:
    branches:
      - release/v0.7.0
    paths:
      - .github/workflows/apply-v070-phase2.yml

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/v0.7.0
          fetch-depth: 0

      - name: Apply cache/search patch
        run: |
          python scripts/apply_v070_phase2.py
          python scripts/apply_v070_phase2_followup.py

      - name: Install native dependencies
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libpulse-dev pkg-config

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Format
        run: cargo fmt --all

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Tests
        run: cargo test --all-targets --all-features

      - name: TUI quality
        run: bash scripts/check-tui-quality.sh

      - name: Commit validated patch
        shell: bash
        run: |
          set -euo pipefail
          rm scripts/apply_v070_phase2.py scripts/apply_v070_phase2_followup.py .github/workflows/apply-v070-phase2.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'perf(v0.7): cache resolutions and broaden Spotify search'
          git push origin HEAD:release/v0.7.0
