name: Trigger v0.6.3

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/trigger-v0.6.3.yml'

permissions:
  contents: write
  actions: write

jobs:
  tag-and-dispatch:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ensure v0.6.3 tag exists
        shell: bash
        run: |
          set -euo pipefail
          test "$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n1)" = "0.6.3"
          if ! git rev-parse refs/tags/v0.6.3 >/dev/null 2>&1; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a v0.6.3 -m "Riff v0.6.3"
            git push origin v0.6.3
          fi

      - name: Dispatch permanent release workflow
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run release.yml \
            --repo "${GITHUB_REPOSITORY}" \
            --ref main \
            -f tag=v0.6.3
