name: Cleanup TUI Logging Boundary

on:
  push:
    branches: [fix/tui-hardening-polish]
    paths:
      - '.github/workflows/cleanup-tui-logging-boundary.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/tui-hardening-polish
          fetch-depth: 0

      - name: Keep logging initialization at CLI boundary
        shell: python
        run: |
          from pathlib import Path
          path = Path('src/player.rs')
          text = path.read_text()
          text = text.replace('pub async fn run(options: PlayerOptions) -> Result<(), String> {\n    init_cli_logging();\n\n', 'pub async fn run(options: PlayerOptions) -> Result<(), String> {\n', 1)
          text = text.replace('is_spotify_track_ids(', 'is_spotify_track_uri(')
          helper = '''\n    fn is_spotify_track_uri(uri: &str) -> bool {\n        is_spotify_track_uri(uri)\n    }\n'''
          # The accidental helper may still be named with the plural form before replacement.
          recursive_helper = '''\n    fn is_spotify_track_uri(uri: &str) -> bool {\n        is_spotify_track_uri(uri)\n    }\n'''
          text = text.replace(recursive_helper, '')
          path.write_text(text)

      - name: Format
        run: cargo fmt --all

      - name: Remove one-shot workflow
        run: rm .github/workflows/cleanup-tui-logging-boundary.yml

      - name: Commit
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'refactor(tui): keep logging at CLI boundary'
          git push origin HEAD:fix/tui-hardening-polish
