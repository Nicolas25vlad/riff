name: Package Check

on:
  pull_request:
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/package-check.yml'
      - '.github/workflows/publish-packages.yml'
      - 'RELEASING.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: package-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cargo-package:
    name: crates.io package dry run
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux audio dependencies
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libpulse-dev pkg-config

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache
        uses: Swatinem/rust-cache@v2

      - name: Verify Cargo.lock
        run: cargo metadata --locked --format-version 1 > /dev/null

      - name: Validate crate package
        run: cargo publish --locked --dry-run
