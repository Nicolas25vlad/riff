name: Remove TUI Startup Print

on:
  push:
    branches: [fix/tui-hardening-polish]
    paths:
      - '.github/workflows/remove-tui-startup-print.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/tui-hardening-polish
          fetch-depth: 0

      - name: Remove direct Workbench startup output
        shell: python
        run: |
          from pathlib import Path
          path = Path('src/workbench/mod.rs')
          text = path.read_text()
          old = '''    println!(
              "Opening Riff Workbench for `{}` ({} tracks)...",
              playlist.name,
              playlist.tracks.len()
          );
          '''.replace('              ', '        ')
          if old not in text:
              raise SystemExit('startup println block not found')
          path.write_text(text.replace(old, '', 1))

      - name: Format
        run: cargo fmt --all

      - name: Remove one-shot workflow
        run: rm .github/workflows/remove-tui-startup-print.yml

      - name: Commit
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'fix(tui): remove startup terminal output'
          git push origin HEAD:fix/tui-hardening-polish
