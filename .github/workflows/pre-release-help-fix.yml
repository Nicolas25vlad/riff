name: Pre-release Help Fix

on:
  push:
    branches: [chore/pre-release-0.6.1]
    paths:
      - .github/workflows/pre-release-help-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/pre-release-0.6.1
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Add TUI to CLI help
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/lib.rs')
          s = p.read_text()
          old = 'COMMANDS:\\n  init [file]         Create a starter playlist'
          new = 'COMMANDS:\\n  tui <file>          Open the interactive Riff Workbench\\n  init [file]         Create a starter playlist'
          if old not in s:
              raise SystemExit('expected help marker not found')
          p.write_text(s.replace(old, new, 1))
      - name: Add regression test
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/lib.rs')
          s = p.read_text()
          marker = '    #[test]\n    fn parses_minimal_playlist()'
          test = '    #[test]\n    fn help_mentions_tui() {\n        assert!(help().contains("tui <file>"));\n    }\n\n'
          if 'fn help_mentions_tui()' not in s:
              if marker not in s:
                  raise SystemExit('test insertion marker not found')
              s = s.replace(marker, test + marker, 1)
              p.write_text(s)
      - run: cargo fmt --all
      - name: Remove one-shot workflow
        run: git rm .github/workflows/pre-release-help-fix.yml
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/lib.rs
          git commit -m 'docs(cli): expose Workbench in help'
          git push origin HEAD:chore/pre-release-0.6.1
