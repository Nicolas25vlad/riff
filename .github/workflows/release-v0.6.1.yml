name: Release v0.6.1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-v0.6.1.yml'

permissions:
  contents: write

concurrency:
  group: release-v0.6.1
  cancel-in-progress: false

jobs:
  release:
    name: Publish riff-music 0.6.1 and create GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate release version
        shell: bash
        run: |
          set -euo pipefail
          version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n1)
          test "$version" = "0.6.1"
          if git ls-remote --exit-code --tags origin refs/tags/v0.6.1 >/dev/null 2>&1; then
            echo '::error::Tag v0.6.1 already exists.'
            exit 1
          fi
          if [[ -z "${CARGO_REGISTRY_TOKEN:-}" ]]; then
            echo '::error::Missing repository secret CARGO_REGISTRY_TOKEN.'
            exit 1
          fi

      - name: Install Linux audio dependencies
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libpulse-dev pkg-config

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache
        uses: Swatinem/rust-cache@v2

      - name: Final crates.io dry run
        run: cargo publish --dry-run

      - name: Publish crates.io
        run: cargo publish

      - name: Create GitHub Release
        shell: bash
        run: |
          set -euo pipefail
          gh release create v0.6.1 \
            --target "$GITHUB_SHA" \
            --title "Riff v0.6.1" \
            --notes $'Patch release focused on TUI reliability and input polish.\n\n### Fixed\n- isolates Workbench from CLI/librespot stdout and stderr logging so logs no longer corrupt the full-screen TUI\n- makes mouse-wheel behavior contextual: Search scrolls results and volume changes only while hovering the volume control\n- removes residual direct terminal output from Workbench startup\n\n### Quality\n- adds a dedicated TUI quality gate to CI\n- rejects direct println!/eprintln! and logger initialization inside Workbench\n- runs Workbench-specific input/hitbox tests\n\nInstall or upgrade with: `cargo install riff-music --force`'
